<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Καλλιέργεια — Σύνοψη Πεδίου</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" crossorigin src="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/index-7cbd9a4e.js"></script>
    <link rel="modulepreload" crossorigin href="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/vendor-cc23ee3c.js">
    <link rel="modulepreload" crossorigin href="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/echarts-a72af00a.js">
    <link rel="stylesheet" href="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/vendor-08a390a6.css">
    <link rel="stylesheet" href="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/index-2ae36874.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- UC511 valve-command feedback overlay (runtime patch, served from /public).
         Wraps TagoIO hooks to show send-downlink-valve-status feedback in Αρδευση.
         Loads after the module bundle; its boot() polls for window.TagoIO. -->
    <script src="https://api.tago.io/file/67934c48e8e573000ae5964b/storage/sagMain/uc511-feedback-overlay.js"></script>

    <!-- T-BLANKPAGE-01 (4/9/2026) - Ο ΦΡΟΥΡΟΣ ΤΗΣ ΚΕΝΗΣ ΣΕΛΙΔΑΣ.
         Στις 4/9/2026 ο αγρος ΚΕΚ εμφανιζε ΚΕΝΗ πρασινη σελιδα χωρις κανενα
         μηνυμα, και δεν υπηρχε τροπος να φανει ΤΙ ελειπε. Ο φρουρος γραφει
         μεσα στο #root ΜΟΝΟ αν αυτο μεινει αδειο μετα απο 6 δευτερολεπτα,
         αρα δεν μπορει ποτε να σκεπασει το κανονικο ταμπλο. -->
    <script>
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          errs.push('ΔΕΝ ΦΟΡΤΩΣΕ: ' + (t.src || t.href));
        } else if (e && e.message) {
          errs.push('ΣΦΑΛΜΑ: ' + e.message);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errs.push('ΣΦΑΛΜΑ: ' + ((e && e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        var r = document.getElementById('root');
        if (!r || r.children.length > 0) return;
        var box = document.createElement('div');
        box.setAttribute('style', 'font:14px/1.5 system-ui,sans-serif;color:#1a2b3c;'
          + 'background:#fff;border:2px solid #e74c3c;border-radius:12px;'
          + 'padding:16px 20px;margin:16px;max-width:820px');
        var h = document.createElement('div');
        h.setAttribute('style', 'font-weight:700;font-size:16px;margin-bottom:8px;color:#e74c3c');
        h.textContent = 'Το ταμπλό δεν φόρτωσε';
        box.appendChild(h);
        var p = document.createElement('div');
        p.setAttribute('style', 'margin-bottom:10px');
        p.textContent = 'Το index.html φορτωθηκε, αλλα ο κωδικας του ταμπλο οχι. '
          + 'Ελεγξτε οτι ΟΛΑ τα παρακατω αρχεια υπαρχουν στο TagoIO Files, '
          + 'storage/sagMain/, με ΑΚΡΙΒΩΣ αυτα τα ονοματα:';
        box.appendChild(p);
        var need = ['index-7cbd9a4e.js', 'vendor-cc23ee3c.js', 'echarts-a72af00a.js',
                    'vendor-08a390a6.css', 'index-2ae36874.css',
                    'uc511-feedback-overlay.js'];
        var ul = document.createElement('ul');
        ul.setAttribute('style', 'margin:0 0 12px 0;padding-left:22px;font-family:monospace');
        for (var i = 0; i < need.length; i++) {
          var li = document.createElement('li');
          li.textContent = need[i];
          ul.appendChild(li);
        }
        box.appendChild(ul);
        var h2 = document.createElement('div');
        h2.setAttribute('style', 'font-weight:700;margin-bottom:4px');
        h2.textContent = 'Τι ανεφερε ο φυλλομετρητης:';
        box.appendChild(h2);
        var pre = document.createElement('pre');
        pre.setAttribute('style', 'white-space:pre-wrap;word-break:break-all;margin:0;'
          + 'font-family:monospace;font-size:12px;color:#6c7a89');
        pre.textContent = (errs.length ? errs : ['(κανενα σφαλμα - ανοιξτε την κονσολα με F12)']).join('\n');
        box.appendChild(pre);
        r.appendChild(box);
      }, 6000);
    })();
    </script>
  </body>
</html>
