<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μετεωρολογικός σταθμός</title>
<!-- T-PUBWX-01 (17/11/2026): δημόσια σελίδα μόνο για προβολή. Διαβάζει ΜΟΝΟ το latest.json δίπλα της (γράφεται κάθε 15΄
     από την analysis publicStationSnapshot). Κανένα token, καμία κλήση στο API της TagoIO. Ενσωματώνεται με <iframe>.
     Παράμετροι URL (μετά το # ή το ?): theme=dark|light (προεπιλογή: όπως το σύστημα) · compact=1 (μόνο οι 4 βασικές
     κάρτες), π.χ. index.html#theme=light&compact=1 — με # γιατί το redirect του api.tago.io/file κόβει το ?… -->

<style>
  :root { --bg:#f6f8f5; --card:#ffffff; --ink:#17251b; --muted:#5d6b61; --line:#dfe6e0; --accent:#2f8f4e; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111712; --card:#1a221c; --ink:#e7efe8; --muted:#9aaa9e; --line:#2a352d; --accent:#5cc27e; --warn:#e3a34a; } }
  :root[data-theme="dark"] { --bg:#111712; --card:#1a221c; --ink:#e7efe8; --muted:#9aaa9e; --line:#2a352d; --accent:#5cc27e; --warn:#e3a34a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:14px 12px 10px; }
  header h1 { font-size:1.15rem; margin:0; }
  header p { margin:2px 0 0; color:var(--muted); font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-height:84px; }
  .lbl { font-size:.8rem; color:var(--muted); }
  .val { font-size:1.45rem; font-weight:650; margin-top:4px; font-variant-numeric:tabular-nums; }
  .val small { font-size:.85rem; font-weight:500; color:var(--muted); }
  .sub { font-size:.75rem; color:var(--muted); margin-top:2px; }
  .arrow { display:inline-block; transition:transform .3s; }
  footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-top:10px; font-size:.75rem; color:var(--muted); }
  .stale { color:var(--warn); }
  .err { margin-top:12px; color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Μετεωρολογικός σταθμός</h1>
    <p id="subtitle"></p>
  </header>
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="err" id="err" hidden></div>
  <footer>
    <span id="updated">Φόρτωση…</span>
    <span>Smart AgroGenius · MACC</span>
  </footer>
</div>
<script>
(function () {
  "use strict";
  // παράμετροι και από το #… : το redirect του api.tago.io/file πετάει το ?… αλλά κρατά το #…
  var qs = new URLSearchParams(location.search + "&" + location.hash.replace(/^#/, ""));
  if (qs.get("theme") === "dark" || qs.get("theme") === "light") document.documentElement.setAttribute("data-theme", qs.get("theme"));
  var compact = qs.get("compact") === "1";
  var REFRESH_MS = 5 * 60 * 1000, STALE_MIN = 60;
  var nf = function (d) { return new Intl.NumberFormat("el-GR", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false }); };
  var f0 = nf(0), f1 = nf(1);
  var tf = new Intl.DateTimeFormat("el-GR", { timeZone: "Europe/Athens", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  var DIRS = ["Β", "ΒΒΑ", "ΒΑ", "ΑΒΑ", "Α", "ΑΝΑ", "ΝΑ", "ΝΝΑ", "Ν", "ΝΝΔ", "ΝΔ", "ΔΝΔ", "Δ", "ΔΒΔ", "ΒΔ", "ΒΒΔ"];
  function dirName(deg) { return DIRS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16]; }
  function bft(kmh) { var L = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118]; for (var i = 0; i < L.length; i++) if (kmh < L[i]) return i; return 12; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function num(o) { return o && o.value != null && isFinite(o.value) ? Number(o.value) : null; }
  function card(label, valueHtml, sub) {
    return '<div class="card"><div class="lbl">' + esc(label) + '</div><div class="val">' + valueHtml + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : "") + "</div>";
  }
  function dash() { return "—"; }
  function rainCard(label, r, extra) {
    if (!r || r.mm == null) return card(label, dash(), extra || "");
    var v = (r.at_least ? "≥ " : "") + f1.format(r.mm) + " <small>mm</small>";
    var sub = extra || "";
    if (r.estimate && r.since) sub = "εκτίμηση από " + esc(r.since.split("-").reverse().join("/"));
    return card(label, v, sub);
  }
  function render(d) {
    document.getElementById("title").textContent = (d.station && d.station.title) || "Μετεωρολογικός σταθμός";
    document.getElementById("subtitle").textContent = (d.station && d.station.subtitle) || "";
    var t = num(d.temperature_c), h = num(d.humidity_pct), w = num(d.wind_kmh), g = num(d.gust_kmh), dir = num(d.wind_dir_deg);
    var html = "";
    html += card("Θερμοκρασία", t == null ? dash() : f1.format(t) + " <small>°C</small>", num(d.dew_point_c) == null ? "" : "σημείο δρόσου " + f1.format(num(d.dew_point_c)) + " °C");
    html += card("Υγρασία", h == null ? dash() : f0.format(h) + " <small>%</small>");
    html += rainCard("Βροχή σήμερα", d.rain_today_mm, num(d.rain_rate_mmh) ? "ραγδαιότητα " + f1.format(num(d.rain_rate_mmh)) + " mm/ώρα" : "");
    html += card("Άνεμος", w == null ? dash() : f0.format(w) + " <small>km/h</small>" + (dir == null ? "" : ' <span class="arrow" style="transform:rotate(' + (dir + 180) + 'deg)" aria-hidden="true">↑</span>'),
      w == null ? "" : bft(w) + " Bft" + (dir == null ? "" : " · " + dirName(dir)) + (g == null ? "" : " · ριπή " + f0.format(g) + " km/h"));
    if (!compact) {
      html += rainCard("Βροχή μήνα", d.rain_month_mm);
      html += rainCard("Βροχή έτους", d.rain_year_mm);
      html += card("Πίεση", num(d.pressure_hpa) == null ? dash() : f0.format(num(d.pressure_hpa)) + " <small>hPa</small>");
      html += card("Δείκτης UV", num(d.uv_index) == null ? dash() : f1.format(num(d.uv_index)));
    }
    document.getElementById("grid").innerHTML = html;
    var last = d.last_uplink ? new Date(d.last_uplink) : null;
    var up = document.getElementById("updated");
    if (!last) { up.textContent = "Χωρίς μετρήσεις"; return; }
    var ageMin = (Date.now() - last.getTime()) / 60000;
    up.className = ageMin > STALE_MIN ? "stale" : "";
    up.textContent = "Τελευταία μέτρηση: " + tf.format(last) + (ageMin > STALE_MIN ? " — ο σταθμός δεν έχει στείλει πρόσφατα" : "");
  }
  function load() {
    fetch("latest.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) { document.getElementById("err").hidden = true; render(d); })
      .catch(function () { var e = document.getElementById("err"); e.hidden = false; e.textContent = "Οι μετρήσεις δεν είναι διαθέσιμες αυτή τη στιγμή. Θα ξαναδοκιμάσουμε σε λίγο."; });
  }
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
