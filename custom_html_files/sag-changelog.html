<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAG · Ημερολόγιο αλλαγών</title>
<!-- T-CHANGELOG-01 (27/11/2026). Δημόσια σελίδα: ημερολόγιο αλλαγών συστήματος (μόνο προσθήκες) + τι είναι τα δεδομένα.
     Διαβάζει ./sag-changelog.json και ./sag-data-dictionary.json από τον ίδιο φάκελο (html_files/). Πηγή: changelog/ στο git.
     ΚΑΝΕΝΑ στοιχείο πελάτη εδώ — τα αρχεία είναι δημόσια. -->
<style>
:root { --bg:#f7f8f6; --card:#fff; --ink:#1d2a22; --mute:#5d6b62; --line:#dfe5e0; --acc:#2f7d4f; --warn:#a8580c; --chip:#eef3ef; }
@media (prefers-color-scheme: dark) { :root { --bg:#121714; --card:#1a211d; --ink:#e7eee9; --mute:#9aaaa0; --line:#2b352f; --acc:#6cc28f; --warn:#f0a35a; --chip:#222b25; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:960px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:18px; margin:28px 0 10px; }
.sub { color:var(--mute); margin:0 0 16px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.tabs button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; }
.tabs button[aria-pressed="true"] { background:var(--acc); color:#fff; border-color:var(--acc); }
.entry h3 { margin:0 0 4px; font-size:16px; }
.meta { color:var(--mute); font-size:13px; display:flex; gap:10px; flex-wrap:wrap; }
.chip { background:var(--chip); border-radius:6px; padding:1px 8px; font-size:12px; }
.chip.known_issue { color:var(--warn); }
.act { margin-top:6px; border-left:3px solid var(--acc); padding-left:10px; }
.src { color:var(--mute); font-size:12px; margin-top:6px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; vertical-align:top; padding:8px 6px; border-bottom:1px solid var(--line); }
th { color:var(--mute); font-weight:600; }
code { font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
.tw { overflow-x:auto; }
.err { color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1>SAG · Ημερολόγιο αλλαγών συστήματος</h1>
  <p class="sub">Κάθε αλλαγή που επηρεάζει μετρήσεις, υπολογισμούς, εξαγωγές ή ό,τι βλέπετε. Οι εγγραφές δεν αλλάζουν ούτε σβήνονται· μια διόρθωση γράφεται ως νέα εγγραφή.</p>
  <div class="box" id="policy">Φόρτωση…</div>
  <div class="tabs" role="group" aria-label="Κοινό">
    <button type="button" data-aud="all" aria-pressed="true">Όλα</button>
    <button type="button" data-aud="researchers" aria-pressed="false">Ερευνητές</button>
    <button type="button" data-aud="producers" aria-pressed="false">Παραγωγοί</button>
    <button type="button" data-aud="operators" aria-pressed="false">Χειριστές</button>
  </div>
  <div id="entries"></div>
  <h2>Τι είναι τα δεδομένα</h2>
  <div class="box" id="timeref"></div>
  <div class="box tw"><table id="dict"><thead><tr><th>Μεταβλητή</th><th>Μονάδα</th><th>Τι είναι</th><th>Συχνότητα / περίοδος</th></tr></thead><tbody></tbody></table></div>
</main>
<script>
(function () {
  var KIND = { calculation: "Υπολογισμός", export: "Εξαγωγή", time_reference: "Χρόνος αναφοράς", known_issue: "Γνωστό ζήτημα", policy: "Απόφαση", fix: "Διόρθωση", display: "Εμφάνιση", data: "Δεδομένα", notice: "Ενημέρωση", device: "Όργανα" };
  var AUD = { researchers: "Ερευνητές", producers: "Παραγωγοί", operators: "Χειριστές" };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var when = function (iso) { if (!iso) return "δεν έχει εφαρμοστεί ακόμη"; return iso.replace("T", " ").replace(/:\d\d(\.\d+)?Z$/, " UTC"); };
  var CL = null, aud = "all";
  function load(name) { return fetch("./" + name + "?t=" + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function render() {
    var list = (CL.entries || []).slice().reverse().filter(function (e) { return aud === "all" || (e.audience || []).indexOf(aud) >= 0; });
    document.getElementById("entries").innerHTML = list.map(function (e) {
      return '<article class="box entry" id="' + esc(e.id) + '"><h3>' + esc(e.id) + " · " + esc(e.title_el) + "</h3>"
        + '<div class="meta"><span class="chip ' + esc(e.kind) + '">' + esc(KIND[e.kind] || e.kind) + "</span>"
        + "<span>Καταγραφή: " + esc(when(e.date_utc)) + "</span><span>Ισχύει από: " + esc(when(e.effective_utc)) + "</span>"
        + "<span>" + (e.audience || []).map(function (a) { return esc(AUD[a] || a); }).join(" · ") + "</span>"
        + (e.reconstructed ? '<span class="chip">ανασύσταση από στοιχεία</span>' : "")
        + (e.supersedes ? '<span class="chip">διορθώνει ' + esc(e.supersedes) + "</span>" : "") + "</div>"
        + "<p>" + esc(e.summary_el) + "</p>"
        + (e.user_action_el ? '<div class="act"><b>Τι σημαίνει για εσάς:</b> ' + esc(e.user_action_el) + "</div>" : "")
        + (e.affects && e.affects.length ? '<div class="src">Αφορά: ' + e.affects.map(function (v) { return "<code>" + esc(v) + "</code>"; }).join(" ") + "</div>" : "")
        + '<div class="src">Πηγή: ' + esc(e.source) + "</div></article>";
    }).join("") || '<p class="sub">Καμία εγγραφή για αυτό το κοινό.</p>';
  }
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      aud = b.getAttribute("data-aud");
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if (CL) render();
    });
  });
  load("sag-changelog.json").then(function (j) {
    CL = j;
    var last = (j.entries || [])[j.entries.length - 1];
    document.getElementById("policy").innerHTML = "<b>Χρόνος αναφοράς: " + esc(j.time_reference) + ".</b> " + esc(j.policy_el)
      + (last ? '<div class="src">Τελευταία εγγραφή: ' + esc(last.id) + " · " + esc(when(last.date_utc)) + "</div>" : "");
    render();
  }).catch(function () { document.getElementById("policy").innerHTML = '<span class="err">Το ημερολόγιο δεν φορτώθηκε. Δοκιμάστε ξανά.</span>'; });
  load("sag-data-dictionary.json").then(function (d) {
    document.getElementById("timeref").textContent = d.time_reference_el;
    var src = d.sources_el || {};
    document.querySelector("#dict tbody").innerHTML = Object.keys(d.variables).map(function (k) {
      var v = d.variables[k];
      return "<tr><td><b>" + esc(v.label_el) + "</b><br><code>" + esc(k) + "</code></td><td>" + esc(v.unit || "—") + "</td><td>" + esc(v.meaning_el)
        + '<div class="src">' + esc(src[v.source] || v.source) + (v.device ? " · " + esc(v.device) : "") + "</div>"
        + (v.known_issue ? '<div class="err">Γνωστό ζήτημα: <a href="#' + esc(v.known_issue) + '">' + esc(v.known_issue) + "</a></div>" : "") + "</td><td>"
        + esc(v.sampling_el) + (v.aggregation_el ? '<div class="src">' + esc(v.aggregation_el) + "</div>" : "") + "</td></tr>";
    }).join("");
  }).catch(function () { document.getElementById("timeref").innerHTML = '<span class="err">Η περιγραφή δεδομένων δεν φορτώθηκε.</span>'; });
})();
</script>
</body>
</html>
