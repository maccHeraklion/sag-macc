  color-scheme: light;
  --s1: #fcfcfb; --s2: #ffffff; --s3: #f4f3f0;
  --tx: #0b0b0b; --tx2: #52514e; --tx3: #6f6e66;

}

    color-scheme: dark;

    --tx: #ffffff; --tx2: #c3c2b7; --tx3: #a5a49a;
    --line: #383835; --line2: #4a4945;
    --visit: #f07070; --check: #ec835a; --office: #fab219; --ok: #4cc94c; --grey: #a5a49a;
    --visit-bg: #2e1c1c; --check-bg: #2d211c; --office-bg: #2c2517; --ok-bg: #182a18; --grey-bg: #2b2b29;
    --accent: #3987e5;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: brightness(.72) contrast(1.1) saturate(.85); }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --s1: #1a1a19; --s2: #232322; --s3: #2b2b29;
  --tx: #ffffff; --tx2: #c3c2b7; --tx3: #a5a49a;
  --line: #383835; --line2: #4a4945;
  --visit: #f07070; --check: #ec835a; --office: #fab219; --ok: #4cc94c; --grey: #a5a49a;

.sub { margin: 0 0 8px; color: var(--tx3); font-size: .82rem; }

.seg button { border: 0; background: var(--s2); padding: 7px 11px; cursor: pointer; border-right: 1px solid var(--line2); }

.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 650; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters > summary { display: none; }
.result { font-size: .84rem; color: var(--tx2); margin-bottom: 8px; }
.result b { color: var(--tx); }

  background: var(--s2); color: var(--tx); font: inherit; font-size: .82rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.maphint:hover { border-color: var(--accent); }
#mapveil span { background: rgba(17,24,39,.85); color: #fff; font-size: .8rem; padding: 7px 13px; border-radius: 999px; }

.side > * { flex: 1 1 300px; min-width: 0; }

.x { border: 0; background: transparent; font-size: 1.1rem; line-height: 1; cursor: pointer; color: var(--tx3); padding: 2px 4px; }

.note { color: var(--tx3); font-size: .78rem; margin: 5px 0; }

.st.c-visit { color: var(--visit); background: var(--visit-bg); }

.st.c-office { color: var(--office); background: var(--office-bg); }
.st.c-ok { color: var(--ok); background: var(--ok-bg); }
.st.c-grey { color: var(--grey); background: var(--grey-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }

.list { list-style: none; margin: 0; padding: 0; }

.row { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 6px 4px; cursor: pointer; border-radius: 6px; min-width: 0; }

  font-size: 10px; font-style: normal; display: flex; align-items: center; justify-content: center; border: 1px solid #b00020; }

@media (max-width: 900px) {
  /* Στο κινητό ο χάρτης πρέπει να φαίνεται στην πρώτη οθόνη: η διαφάνεια μένει ολόκληρη, απλώς πιο πυκνή. */
  .wrap { padding: 8px; }
  h1 { font-size: 1.05rem; margin-bottom: 4px; }
  .sub { display: none; }
  .banner { padding: 5px 9px; font-size: .78rem; margin-bottom: 5px; }
  .honest { padding: 5px 9px; gap: 1px 9px; font-size: .72rem; line-height: 1.3; margin-bottom: 5px; }
  .honest .why { font-size: .68rem; }
  .bar { margin-bottom: 5px; }
  .filters > summary { display: block; font-size: .84rem; font-weight: 650; padding: 3px 0 5px; cursor: pointer; }
  .result { font-size: .76rem; margin-bottom: 5px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  #map { height: 56vh; min-height: 300px; }
  .bar select { flex: 1 1 45%; max-width: none; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 0; padding: 7px 4px; font-size: .8rem; }
  .scroll { max-height: none; }
}

      gwUnid: gws.filter(function (g) { return !g.net && g.st.k === 'g_unid'; }).length, gwOff: gws.filter(function (g) { return g.st.k === 'g_off'; }).length, gwStore: gws.filter(function (g) { return g.st.k === 'g_storage'; }).length,

/* Τι λείπει ή έχει παλιώσει. Κάθε πηγή κρίνεται χωριστά: ο πυρήνας και η ανάλυση πυλών είναι διαφορετικές εκτελέσεις. */
function freshness(model, now) {

/* ═══ ΦΙΛΤΡΑ ═════════════════════════════════════════════════════════════════

  /* Έλεγχος 7/11 με πραγματικά δεδομένα: οι πύλες της αποθήκης φούσκωναν τον στόλο. Φαίνονται μόνο αν ζητηθούν από το φίλτρο κατάστασης. */
  if (skip !== 'status' && g.st.k === 'g_storage' && flt.status !== 'g_storage') return false;
  if (skip !== 'status' && isGwStatus(flt.status) && g.keys.indexOf(flt.status) < 0) return false;

  if (!c.st) return 'Γραμμή υπάρχει μόνο όταν το δίκτυο επιβεβαιώνει τη λήψη.';
  if (c.stKnown >= c.st) return 'Όλοι οι μετεωρολογικοί σταθμοί S2120 (' + c.st + ') αναφέρουν από ποια πύλη πέρασαν. Γραμμή υπάρχει μόνο όταν το δίκτυο επιβεβαιώνει τη λήψη.';

  return 'Γιατί οι σταθμοί δεν έχουν γραμμή: κανένας από τους ' + c.st + ' μετεωρολογικούς σταθμούς S2120 δεν αναφέρει από ποια πύλη πέρασε.' + tail;

function primaryState(f) {

<script>
/* ═══════════════════════════════════════════════════════════════════════════

var FIXTURE = /[?&]fixture=1(&|$)/.test(location.search) && window.top === window.self && !window.TagoIO;

var RAW = newRaw();
var MODEL = buildModel(RAW, Date.now());
var UI = { map: null, layer: null, over: null, userMoved: false, fitN: -1, sel: null, km: 10, started: false, connected: false,
  flt: { view: 'all', producer: '', status: '', type: '', q: '', nocalc: true } };

function chip(s) { return '<span class="st c-' + s.c + '">' + s.ic + ' ' + esc(s.w) + '</span>'; }
function clock(ms) {
  return new Date(ms).toLocaleString('el-GR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
}
function byKey(list, key) { for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i]; return null; }

/* ═══ ΧΑΡΤΗΣ ═══════════════════════════════════════════════════════════════ */
function initMap() {
  if (UI.map || typeof L === 'undefined') {
    if (typeof L === 'undefined') { var w = $('warn'); w.hidden = false; w.textContent = 'Η βιβλιοθήκη χάρτη δεν φορτώθηκε. Οι λίστες δουλεύουν, ο χάρτης όχι.'; }

  /* T-MAPDRAG-01: (pointer: coarse) ρωτά για την ΚΥΡΙΑ συσκευή. Laptop με οθόνη αφής έχει ποντίκι και δεν παγώνει. */

  var html = '<div class="pin ' + cls + ' p-' + s.c + (selected ? ' sel' : '') + '">' + (glyph || esc(text))
    + (sub ? '<i class="sub">' + esc(sub) + '</i>' : '') + (suspect ? '<i class="sus">!</i>' : '') + (cnt ? '<i class="cnt">' + cnt + '</i>' : '') + '</div>';

  gshow.forEach(function (g) {
    if (!g.p) return;
    var label = g.name + ': ' + g.st.w + (g.posKind === 'suspect' ? ' · ύποπτη θέση' : '');
    var m = L.marker([g.p.lat, g.p.lng], { icon: pinIcon(g.st, 'gw', 'Πύλη', badgeOf(g.st, null), g.posKind === 'suspect', !!selGw && selGw === g, GW_SVG),

  if (selGw && selGw.p) {

  $('nopos').innerHTML = list.length ? '<ul class="list">' + list.map(function (x) {
    return '<li><button type="button" class="row" data-sel="' + (x.kind === 'gw' ? 'gw' : 'field') + '" data-key="' + esc(x.key) + '"><div class="rowT">'
      + (x.kind === 'gw' ? (/^Πύλη /.test(x.name) ? '' : 'Πύλη: ') : 'Αγρός: ') + esc(x.name) + '</div><div class="rowM">' + esc(x.why) + '</div></button></li>'; }).join('') + '</ul>'
    : '<div class="note">Όλα όσα εμφανίζονται έχουν θέση.</div>';
}
function renderResults(v) {
  var gs = v.gws.slice().sort(function (a, b) { return gwTrouble(b) - gwTrouble(a) || String(a.name).localeCompare(String(b.name), 'el'); });
  var fs = v.fields.slice().sort(function (a, b) { return trouble(b) - trouble(a) || String(a.name).localeCompare(String(b.name), 'el'); });
  $('resHead').textContent = 'Αποτελέσματα (' + (gs.length + fs.length) + ')';
  var h = '';
  if (gs.length) {
    h += '<ul class="list">' + gs.map(function (g) {
      return '<li><button type="button" class="row" data-sel="gw" data-key="' + esc(g.key) + '"><div class="rowT">' + esc(g.name) + '</div>'
        + '<div class="chips">' + chip(g.st) + (g.posKind === 'suspect' ? '<span class="st c-check">! ύποπτη θέση</span>' : '') + '</div>'
        + '<div class="rowM">Πύλη · ' + plural(g.heardList.length, 'αγρός', 'αγροί') + ' με επιβεβαιωμένη λήψη</div></button></li>'; }).join('') + '</ul>';
  }
  if (fs.length) h += '<ul class="list">' + fs.map(function (f) { return fieldRowHtml(f, plural(f.devs.length, 'όργανο', 'όργανα')); }).join('') + '</ul>';
  $('results').innerHTML = h || '<div class="note">' + (UI.connected ? 'Τίποτα δεν ταιριάζει στα φίλτρα.' : 'Αναμονή δεδομένων…') + '</div>';
}
function renderHonest() {
  var now = Date.now(), fr = freshness(MODEL, now), c = MODEL.cover, parts = [];
  fr.srcs.forEach(function (s) {
    parts.push('<span>' + esc(s.n) + ': <b>' + (s.t ? esc(clock(s.t)) + '</b> (' + esc(ageWords(s.h)) + ')' : '—</b>') + '</span>');
  });
  /* Δύο διαφορετικές μετρήσεις, ποτέ ένα άθροισμα: μια δηλωμένη πύλη χωρίς ταυτοποίηση μπορεί να είναι η ίδια με μια ορατή. */
  parts.push('<span>Πύλες που βλέπει το δίκτυο: <b>' + c.gwNet + '</b> (' + c.gwAlive + ' ζωντανές)</span>');
  parts.push('<span>Δηλωμένες χωρίς ταυτοποίηση: <b>' + c.gwUnid + '</b> · εκτός δικτύου: <b>' + c.gwOff + '</b> · στην αποθήκη: <b>' + c.gwStore + '</b></span>');
  var seen = Number.isFinite(c.seen) && Number.isFinite(c.sensorsAll) && c.sensorsAll > 0;
  parts.push('<span>Αισθητήρες με γνωστή πύλη: <b>' + (seen ? c.seen + ' από ' + c.sensorsAll : '—') + '</b>'
    + (c.total ? ' (στους αγρούς ' + c.known + ' από ' + c.total + ')' : '') + '</span>');
  if (c.fSus) parts.push('<span>Αγροί με ύποπτη θέση: <b>' + c.fSus + '</b></span>');
  if (c.bad) parts.push('<span>Εγγραφές που αγνοήθηκαν ως άκυρες: <b>' + c.bad + '</b></span>');
  parts.push('<span class="why">' + esc(stationWhy(c)) + '</span>');
  $('honest').innerHTML = parts.join('');
  var stale = fr.srcs.filter(function (s) { return s.stale; });
  var el = $('stale');
  if (UI.started && !fr.any) { el.hidden = false; el.textContent = 'Δεν έχουν φτάσει δεδομένα. Ό,τι βλέπεις εδώ δεν λέει τίποτα για τον στόλο.'; }
  else if (stale.length) {
    el.hidden = false;
    el.textContent = '⚠ Παλιά δεδομένα, πάνω από ' + STALE_DATA_H + ' ώρες: ' + stale.map(function (s) { return s.n + ' ' + ageWords(s.h); }).join(' · ')
      + '. Η εικόνα μπορεί να μην ισχύει πια.';
  } else el.hidden = true;
  var w = $('warn');
  if (fr.any && !MODEL.hasMap) {
    w.hidden = false;
    w.textContent = 'Δεν φτάνει map_field: εμφανίζονται μόνο όσοι αγροί υπάρχουν στον πίνακα στόλου, χωρίς παραγωγό και χωρίς συνδέσεις ανά όργανο.';
  } else if (typeof L !== 'undefined') w.hidden = true;
}
function renderAll() {
  var v = visible(MODEL, UI.flt);
  renderHonest();
  renderFilters(v);
  renderPanel();
  drawMap(v);
  renderNoPos(v);
  renderResults(v);
}
function refresh() { MODEL = buildModel(RAW, Date.now()); renderAll(); }

function renderLegend() {
  var items = SEV.slice().reverse().concat([FSTATE.silent, FSTATE.gaps, FSTATE.noinst, FSTATE.nocalc, GSTATE.g_alive, GSTATE.g_sparse, GSTATE.g_nowit, GSTATE.g_off, GSTATE.g_unid, GSTATE.g_storage]);
  var mini = function (cls, svg, w) { return '<div class="i"><span class="pin mini ' + cls + ' p-grey">' + svg + '</span> ' + esc(w) + '</div>'; };
  var h = '<div class="i"><b>Το σχέδιο λέει τι είναι:</b></div>' + mini('gw', GW_SVG, 'πύλη')
    + [KIND.field, KIND.hotel, KIND.station, KIND.valve, KIND.none].map(function (k) { return mini('f', k.svg, k.d); }).join('')
    + '<div class="i"><b>Το χρώμα λέει πώς είναι:</b></div>'
    + items.map(function (s) { return '<div class="i">' + chip(s) + '</div>'; }).join('');
  h += '<div class="i"><span class="ln"></span> επιβεβαιωμένη λήψη</div><div class="i"><span class="ln d"></span> κοντά, χωρίς επιβεβαίωση</div>'
    + '<div class="i">σήμα στη γωνία: κάτι δεν πάει καλά· χωρίς σήμα, κανένα θέμα</div><div class="i">αριθμός: εγγραφές στο ίδιο σημείο· σκέτος αριθμός όταν είναι διαφορετικού είδους</div><div class="i">! : ύποπτη θέση</div>'
    + '<div class="i">Κάποιοι σταθμοί σιωπούν κάθε νύχτα: οι ώρες αυτές είναι πραγματικές και φαίνονται ως ΜΕ ΚΕΝΑ.</div>';
  $('legend').innerHTML = h;
}

/* ═══ ΣΥΜΒΑΝΤΑ ═══════════════════════════════════════════════════════════════ */
function setFlt(k, v) { UI.flt[k] = v; refit(); renderAll(); }
/* Κάθε αλλαγή φίλτρου φέρνει τον χάρτη στα αποτελέσματα: φίλτρο παραγωγού που δείχνει άλλη περιοχή μοιάζει με κενό αποτέλεσμα. */
function refit() { UI.userMoved = false; UI.fitN = null; }
$('vAll').onclick = function () { setFlt('view', 'all'); };
$('vGw').onclick = function () { setFlt('view', 'gw'); };
$('vFields').onclick = function () { setFlt('view', 'fields'); };
$('fProducer').onchange = function (e) { setFlt('producer', e.target.value); };
$('fStatus').onchange = function (e) { setFlt('status', e.target.value); };
$('fType').onchange = function (e) { setFlt('type', e.target.value); };
$('fQ').oninput = function (e) { setFlt('q', String(e.target.value || '').trim()); };
$('fNoCalc').onchange = function (e) { setFlt('nocalc', !!e.target.checked); };
$('bClear').onclick = function () {
  UI.flt = { view: 'all', producer: '', status: '', type: '', q: '', nocalc: true };
  $('fQ').value = ''; $('fNoCalc').checked = true; UI.sel = null; refit(); renderAll();
};
$('bFit').onclick = function () {
  if (UI.map && UI.lastPts && UI.lastPts.length) { try { UI.map.fitBounds(UI.lastPts, { padding: [36, 36], maxZoom: 13 }); } catch (e) {} }
};
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-sel],[data-close],[data-frame],#panelHint') : null;
  if (!t) return;
  if (t.id === 'panelHint') { hint(false); reveal('panel'); return; }
  if (t.hasAttribute('data-frame')) { if (UI.sel && UI.sel.kind === 'gw') frameGateway(byKey(MODEL.gws, UI.sel.key)); reveal('map'); return; }
  if (t.hasAttribute('data-close')) { UI.sel = null; renderPanel(); drawMap(visible(MODEL, UI.flt)); return; }
  var kind = t.getAttribute('data-sel'), key = t.getAttribute('data-key');
  select_({ kind: kind, key: key });
  var o = kind === 'gw' ? byKey(MODEL.gws, key) : (kind === 'field' ? byKey(MODEL.fields, key) : byKey(MODEL.groups, key));
  if (kind !== 'gw' && o && o.p && UI.map) { UI.userMoved = true; UI.map.panTo([o.p.lat, o.p.lng]); }
  if (o && o.p) reveal('map');
});

/* ═══ ΕΚΚΙΝΗΣΗ ═════════════════════════════════════════════════════════════════ */
function feed(data) {
  if (!data) return;
  var pts = [];
  (Array.isArray(data) ? data : [data]).forEach(function (g) {
    if (g && Array.isArray(g.result)) pts = pts.concat(g.result);
    else if (g && g.variable) pts.push(g);
  });
  if (!pts.length) return;
  ingestRows(RAW, pts);
  UI.connected = true;
  UI.started = true;
  refresh();
}
function startLive() {
  if (!(window.TagoIO && window.TagoIO.onStart)) {
    UI.started = true;
    renderAll();
    var w = $('warn'); w.hidden = false;
    w.textContent = 'Η σελίδα δεν τρέχει μέσα στο TagoIO: ο χάρτης λειτουργεί, τα δεδομένα όχι.';
    return;
  }
  window.TagoIO.onStart(function (w) {
    try {
      var ps = (w && w.display && w.display.parameters) || [];
      ps.forEach(function (p) {
        if (p && p.key === 'gateway_names') { try { RAW.names = JSON.parse(String(p.value || '{}')) || {}; } catch (e) { RAW.names = {}; } }
      });
    } catch (e) {}
    UI.started = true;
    if (w && w.data) feed(w.data); else renderAll();
    setTimeout(function () { try { if (UI.map) UI.map.invalidateSize(); } catch (e) {} }, 200);
  });
  window.TagoIO.onRealtime(function (d) { try { feed(d); } catch (e) {} });
  window.TagoIO.ready();
  /* Widget με λάθος μεταβλητές δεν καλεί ποτέ με δεδομένα: χωρίς αυτό η σελίδα θα περίμενε σιωπηλά για πάντα. */
  setTimeout(function () { if (!UI.started) { UI.started = true; renderAll(); } }, 10000);
}
function startFixture() {
  $('demo').hidden = false;
  if (/[?&]theme=dark/.test(location.search)) document.documentElement.setAttribute('data-theme', 'dark');
  fetch('../analysis/test/fixtures/sag_map_fixture.json').then(function (r) { return r.json(); }).then(function (fx) {
    /* Οι ώρες μετατοπίζονται στο τώρα, αλλιώς το αρχείο θα έβγαζε πάντα κόκκινη λωρίδα. &stale=1: δείχνει τη λωρίδα. */
    var shift = Date.now() - Date.parse(fx.base) - (/[?&]stale=1/.test(location.search) ? 3 * 36e5 : 0);
    RAW.names = fx.names || {};
    feed(fx.rows.map(function (r) {
      var c = JSON.parse(JSON.stringify(r));
      c.time = new Date(Date.parse(c.time) + shift).toISOString();
      return c;
    }));
  }).catch(function () {
    UI.started = true; renderAll();
    var w = $('warn'); w.hidden = false; w.textContent = 'Το αρχείο δοκιμής δεν φορτώθηκε. Άνοιξε τη σελίδα από στατικό διακομιστή στη ρίζα του αποθετηρίου.';
  });
}

/* Στον υπολογιστή τα φίλτρα είναι πάντα ανοιχτά (χωρίς κεφαλίδα), στο κινητό διπλωμένα. */
var WIDE = window.matchMedia('(min-width: 901px)');
var syncFilters = function () { $('filters').open = WIDE.matches; };
syncFilters();
if (WIDE.addEventListener) WIDE.addEventListener('change', syncFilters);
renderLegend();
initMap();
renderAll();
setInterval(renderHonest, 60000);   // η ηλικία των δεδομένων μεγαλώνει και χωρίς νέα εγγραφή: αυτό πιάνει το πάγωμα
if (FIXTURE) startFixture();
else {
  var sdk = document.createElement('script');
  sdk.src = SDK_URL;
  sdk.onload = startLive;
  sdk.onerror = startLive;
  document.body.appendChild(sdk);
}
</script>
</body>
</html>
