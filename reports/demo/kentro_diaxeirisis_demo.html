 <div style="margin-top:12px">${kv([['Καθαρή αξία',eur(t.net,2)],['Έκπτωση '+(o.disc||0)+' %','−'+eur(t.dis,2)],['ΦΠΑ 24 %',eur(t.vat,2)],['<b>Σύνολο</b>','<b>'+eur(t.tot,2)+'</b>'],['Κόστος εξοπλισμού',eur(t.cost)],['Μικτό περιθώριο',eur(t.base-t.cost)+' ('+(t.base?Math.round(100*(t.base-t.cost)/t.base):0)+' %)']])}</div>`,

function stage(id,d){const l=LEADS.find(x=>x.id===id);l.stage=STAGES[Math.max(0,Math.min(3,STAGES.indexOf(l.stage)+d))];closeD();go('pipeline');toast('Στάδιο: '+l.stage)}
function win(id){const l=LEADS.find(x=>x.id===id);l.stage='Κερδήθηκε';l.due=null;l.next='—';let c=CUST.find(c=>c.n===l.n);if(!c){c={id:'C'+(CUST.length+1),n:l.n,t:l.t,vat:'',city:'—',ct:'—',ph:'—',st:'Onboarding',since:T,owner:l.owner};CUST.push(c)}l.cust=c.id;const plan=PROD.find(p=>p.kind==='plan'&&p.cats.includes(l.cat));OFFERS.unshift({id:'ΠΡ-26-0'+(35+OFFERS.length),c:c.id,st:'Πρόχειρη',d:T,valid:addD(30),lines:[[plan.k,1],['install',1]],disc:0});closeD();go('offers');toast('Δημιουργήθηκε πελάτης και πρόχειρη προσφορά')}
function accept(k){const o=OFFERS[k];if(o.st!=='Στάλθηκε'){toast('Η προσφορά πρέπει πρώτα να σταλεί');return}const plan=o.lines.find(([kk])=>prod(kk).kind==='plan');const cat0=plan?prod(plan[0]).cats[0]:'field';const id='I'+(INST.length+1);
 const x={id,c:o.c,n:'Νέα εγκατάσταση ('+o.id+')',cat:cat0,step:3,h:'office',plan:plan?plan[0]:'sense',start:null,end:null,need:[],units:[]};let miss=0;
 for(const[kk,q]of o.lines)if(prod(kk).kind==='eq'&&kk!=='kit')for(let j=0;j<q;j++){x.need.push(kk);const u=UNITS.find(u=>u.k===kk&&u.st==='Απόθεμα');if(u){u.st='Δεσμευμένο';u.res=o.id;u.hist.push({d:T,t:'Δέσμευση για '+o.id});MOVES.push({d:T,k:'Δέσμευση',p:kk,t:o.id+' · '+cust(o.c).n})}else miss++}
 o.st='Αποδεκτή';o.inst=id;INST.push(x);const c=cust(o.c);if(c.st!=='Ενεργός')c.st='Onboarding';closeD();go('installs');toast(miss?'Άνοιξε onboarding · λείπουν '+miss+' τεμάχια, δες «Απόθεμα»':'Άνοιξε onboarding · όλο το υλικό δεσμεύτηκε')}
function adv(id){const x=inst(id);if(x.step>=7)return;if(x.step===3){const off=OFFERS.find(o=>o.inst===id);for(const k of x.need.slice(x.units.length)){const u=UNITS.find(u=>u.k===k&&(u.st==='Δεσμευμένο'&&u.res===(off&&off.id)))||UNITS.find(u=>u.k===k&&u.st==='Απόθεμα');if(!u){toast('Λείπει '+prod(k).n+' — δημιουργήστε παραγγελία');return}u.st='Εγκατεστημένο';u.inst=id;u.res=null;u.hist.push({d:T,t:'Εγκατάσταση: '+x.n});x.units.push(u.sn);MOVES.push({d:T,k:'Εγκατάσταση',p:k,t:x.n})}}
 x.step++;if(x.step===7){x.start=T;x.end=addD(365);x.h='ok';INV.unshift({id:'(νέο)',c:x.c,i:id,d:T,due:addD(30),amt:prod(x.plan).price*1.24,paid:null,k:'Συνδρομή'});const c=cust(x.c);c.st='Ενεργός'}closeD();go(S.page);toast(x.step===7?'Η συνδρομή ενεργοποιήθηκε και εκδόθηκε χρέωση':'Επόμενο βήμα: '+STEPS[x.step])}
function renew(id){const x=inst(id);const base=x.end&&days(x.end)>0?x.end:T;const d=new Date(base);d.setFullYear(d.getFullYear()+1);x.end=ISO(d);INV.unshift({id:'(νέο)',c:x.c,i:id,d:T,due:addD(30),amt:prod(x.plan).price*1.24,paid:null,k:'Συνδρομή'});closeD();go(S.page);toast('Ανανεώθηκε έως '+fd(x.end)+' · εκδόθηκε χρέωση')}
function pay(id){const i=INV.find(x=>x.id===id);i.paid=T;go('invoices');toast('Καταγράφηκε η είσπραξη')}
function receive(id){const p=PO.find(x=>x.id===id);p.st='Παραλήφθηκε';p.rec=T;let n=0;for(const[k,q]of p.lines){for(let j=0;j<q;j++){mkUnit(k,p.id,T);n++}MOVES.push({d:T,k:'Παραλαβή',p:k,t:p.id+' · '+q+' τεμ.'})}closeD();go('pos');toast('Παραλήφθηκαν '+n+' τεμάχια, μπήκαν στην αποθήκη')}
function rma(tid,sn){const u=UNITS.find(x=>x.sn===sn),x=inst(u.inst);u.st='RMA';x.units=x.units.filter(s=>s!==sn);u.hist.push({d:T,t:'RMA προς '+supN(prod(u.k).sup)+' ('+tid+')'});MOVES.push({d:T,k:'RMA',p:u.k,t:x.n+' → '+supN(prod(u.k).sup)});const t=TICK.find(x=>x.id===tid);t.st='Σε εξέλιξη';t.k='RMA';x.step=Math.min(x.step,7);closeD();go('units');toast('Η μονάδα στάλθηκε για επισκευή · η εγκατάσταση χρειάζεται αντικατάσταση')}
/* ════════════ ΦΟΡΜΕΣ ════════════ */
function leadForm(){openD('CRM','Νέα ευκαιρία',`<div class="fld"><label>Επωνυμία</label><input id="ln"></div><div class="fld"><label>Τύπος</label><select id="lt">${['Αγρότης','Οργάνωση','Ξενοδοχείο','Δήμος','Σχολείο'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fld"><label>Περίπτωση εγκατάστασης</label><select id="lc">${Object.keys(CAT).map(k=>`<option value="${k}">${CAT[k].n}</option>`).join('')}</select></div><div class="fld"><label>Εκτιμώμενη αξία (€)</label><input id="lv" type="number" value="1000"></div><div class="fld"><label>Επόμενη ενέργεια</label><input id="lx" value="Πρώτη επαφή"></div>`,
 `<button class="btn" onclick="closeD()">Άκυρο</button><button class="btn p" onclick="if(!$('#ln').value.trim()){toast('Συμπλήρωσε επωνυμία');return}LEADS.push({id:'L'+(LEADS.length+1),n:$('#ln').value.trim(),t:$('#lt').value,stage:'Νέα',val:+$('#lv').value||0,cat:$('#lc').value,owner:'Μιχάλης',next:$('#lx').value,due:addD(3),src:'Χειροκίνητα'});closeD();go('pipeline');toast('Η ευκαιρία καταχωρίστηκε')">Αποθήκευση</button>`)}
function actForm(ref){const opts=[...CUST.map(c=>[c.id,c.n]),...LEADS.filter(l=>l.stage!=='Κερδήθηκε').map(l=>[l.id,l.n+' (ευκαιρία)'])];openD('CRM','Καταγραφή επαφής',`<div class="fld"><label>Αφορά</label><select id="ar">${opts.map(([v,n])=>`<option value="${v}" ${v===ref?'selected':''}>${n}</option>`).join('')}</select></div><div class="fld"><label>Είδος</label><select id="ak">${['Κλήση','Επίσκεψη','Συνάντηση','Email'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fld"><label>Σημείωση</label><input id="at"></div>`,
 `<button class="btn" onclick="closeD()">Άκυρο</button><button class="btn p" onclick="ACT.push({d:T,who:'Μιχάλης',k:$('#ak').value,ref:$('#ar').value,t:$('#at').value||'—'});closeD();go('activities');toast('Καταγράφηκε')">Αποθήκευση</button>`)}
function offerForm(c0){const sell=PROD.filter(p=>p.kind!=='x');openD('Πωλήσεις','Νέα προσφορά',`<div class="fld"><label>Πελάτης</label><select id="oc">${CUST.map(c=>`<option value="${c.id}" ${c.id===c0?'selected':''}>${c.n}</option>`).join('')}</select></div><div class="fld"><label>Έκπτωση (%)</label><input id="od" type="number" value="0" min="0" max="30" oninput="ofSum()"></div><div class="sec">Είδη</div>
 ${tbl(['Είδος','#Τιμή','#Απόθεμα','#Ποσ.'],sell.map(p=>`<tr><td>${p.n}<div class="sub">${{plan:'Πακέτο',eq:'Εξοπλισμός',svc:'Υπηρεσία'}[p.kind]}</div></td><td class="num">${eur(p.price)}</td><td class="num">${p.kind==='eq'?stockOf(p.k):'—'}</td><td class="num"><input class="inp" style="width:64px;height:30px" type="number" min="0" value="0" data-k="${p.k}" oninput="ofSum()"></td></tr>`))}<div id="osum" style="margin-top:12px"></div>`,
 `<button class="btn" onclick="closeD()">Άκυρο</button><button class="btn p" onclick="saveOffer()">Αποθήκευση</button>`);ofSum()}
function ofLines(){return $$('#dbd input[data-k]').filter(i=>+i.value>0).map(i=>[i.dataset.k,+i.value])}
function ofSum(){const t=offTot({lines:ofLines(),disc:+$('#od').value||0});$('#osum').innerHTML=kv([['Καθαρή αξία',eur(t.net,2)],['Μετά την έκπτωση',eur(t.base,2)],['<b>Σύνολο με ΦΠΑ</b>','<b>'+eur(t.tot,2)+'</b>'],['Μικτό περιθώριο',t.base?Math.round(100*(t.base-t.cost)/t.base)+' %':'—']])}
function saveOffer(){const lines=ofLines();if(!lines.length){toast('Πρόσθεσε τουλάχιστον ένα είδος');return}OFFERS.unshift({id:'ΠΡ-26-0'+(35+OFFERS.length),c:$('#oc').value,st:'Πρόχειρη',d:T,valid:addD(30),lines,disc:+$('#od').value||0});closeD();go('offers');toast('Η προσφορά αποθηκεύτηκε ως πρόχειρη')}
function poForm(s0,k0){const s=s0||SUP[0].id;openD('Αγορές','Νέα παραγγελία αγοράς',`<div class="fld"><label>Προμηθευτής</label><select id="ps" onchange="poForm(this.value)">${SUP.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${x.n}</option>`).join('')}</select></div><div class="alert info">Χρόνος παράδοσης ${sup(s).lead} ημέρες · ${sup(s).terms}</div>
 ${tbl(['Είδος','#Διαθέσιμα','#Ελάχιστο','#Κόστος','#Ποσ.'],PROD.filter(p=>p.sup===s).map(p=>`<tr><td>${p.n}</td><td class="num">${stockOf(p.k)}</td><td class="num">${p.min}</td><td class="num">${eur(p.cost)}</td><td class="num"><input class="inp" style="width:64px;height:30px" type="number" min="0" value="${p.k===k0?Math.max(p.min*2-stockOf(p.k),p.min):0}" data-k="${p.k}"></td></tr>`))}`,
 `<button class="btn" onclick="closeD()">Άκυρο</button><button class="btn p" onclick="savePO('${s}')">Αποστολή στον προμηθευτή</button>`)}
function savePO(s){const lines=$$('#dbd input[data-k]').filter(i=>+i.value>0).map(i=>[i.dataset.k,+i.value,prod(i.dataset.k).cost]);if(!lines.length){toast('Πρόσθεσε ποσότητα');return}PO.unshift({id:'ΠΑ-26-0'+(17+PO.length),sup:s,d:T,st:'Στάλθηκε',eta:addD(sup(s).lead),lines});closeD();go('pos');toast('Η παραγγελία στάλθηκε')}
/* Οδηγός νέας εγκατάστασης */
let W;function wizard(c){W={s:0,c:c||'',nc:'',vat:'',cat:'',name:'',plan:''};wz()}
function wz(){const L=['Πελάτης','Περίπτωση','Στοιχεία','Πακέτο','Επιβεβαίωση'];let h=`<div class="steps">${L.map((l,i)=>`<span class="${i===W.s?'on':i<W.s?'d':''}">${i+1}. ${l}</span>`).join('')}</div>`;
 if(W.s===0)h+=`<div class="fld"><label>Υπάρχων πελάτης</label><select onchange="W.c=this.value;wz()"><option value="">— νέος πελάτης —</option>${CUST.map(c=>`<option value="${c.id}" ${W.c===c.id?'selected':''}>${c.n}</option>`).join('')}</select></div>${W.c?'':`<div class="fld"><label>Επωνυμία νέου πελάτη</label><input value="${esc(W.nc)}" oninput="W.nc=this.value"></div><div class="fld"><label>ΑΦΜ</label><input value="${esc(W.vat)}" oninput="W.vat=this.value"></div><p class="sub">Χρήστες TagoRUN: 59 / 100. Ο νέος πελάτης μπορεί να μπει σε υπάρχουσα οργάνωση αντί για νέο χρήστη.</p>`}`;
 if(W.s===1)h+=`<p class="sub" style="margin-top:0">Η περίπτωση δηλώνεται, δεν βγαίνει από τα όργανα. Ορίζει πακέτα, παραμετροποίηση και παρακολούθηση.</p><div class="opts">${Object.keys(CAT).map(k=>`<div class="opt ${W.cat===k?'on':''}" onclick="W.cat='${k}';W.plan='';wz()"><b><i class="dot" style="background:${CAT[k].c}"></i>${CAT[k].n}</b><span class="sub">${CAT[k].d}</span></div>`).join('')}</div>`;
 if(W.s===2)h+=`<div class="fld"><label>Όνομα εγκατάστασης</label><input value="${esc(W.name)}" oninput="W.name=this.value"></div><div class="fld"><label>Θέση (αντιγραφή από Google Maps)</label><input placeholder="35.xxxxx, 25.xxxxx"></div>`;
 if(W.s===3)h+=`<div class="opts">${PROD.filter(p=>p.kind==='plan'&&p.cats.includes(W.cat)).map(p=>`<div class="opt ${W.plan===p.k?'on':''}" onclick="W.plan='${p.k}';wz()"><b>${p.n.split(' — ')[0]}</b><span class="sub">${p.n.split(' — ')[1]||''} · ${eur(p.price)}/έτος</span></div>`).join('')}</div><p class="sub">Εμφανίζονται μόνο τα πακέτα που ταιριάζουν στην περίπτωση.</p>`;
 if(W.s===4)h+=kv([['Πελάτης',W.c?cust(W.c).n:W.nc],['Περίπτωση',catT(W.cat)],['Εγκατάσταση',esc(W.name)],['Πακέτο',prod(W.plan).n]])+`<div class="alert info" style="margin-top:14px">Με τη δημιουργία: πελάτης και χρήστης αν χρειάζεται → createField με την περίπτωση → η εγκατάσταση περιμένει όργανα από την αποθήκη.</div>`;
 const ok=[W.c||(W.nc.trim()&&W.vat.trim()),W.cat,W.name.trim(),W.plan,true][W.s];
 openD('Υλοποίηση','Νέα εγκατάσταση',h,`${W.s?'<button class="btn" onclick="W.s--;wz()">← Πίσω</button>':''}<span style="flex:1"></span><button class="btn p" ${ok?'':'disabled'} onclick="${W.s<4?'W.s++;wz()':'finishW()'}">${W.s<4?'Επόμενο →':'Δημιουργία'}</button>`)}
function finishW(){let c=W.c;if(!c){c='C'+(CUST.length+1);CUST.push({id:c,n:W.nc.trim(),t:'Αγρότης',vat:W.vat.trim(),city:'—',ct:'—',ph:'—',st:'Onboarding',since:T,owner:'Μιχάλης'})}
 const need={field:['s2120','lse01'],greenhouse:['em320','se0x'],landscape:['lse01','uc511'],station:['s2120'],automation:['uc511']}[W.cat];INST.push({id:'I'+(INST.length+1),c,n:W.name.trim(),cat:W.cat,step:3,h:'office',plan:W.plan,start:null,end:null,need,units:[]});closeD();go('installs');toast('Δημιουργήθηκε · επόμενο βήμα: Όργανα')}
/* ════════════ ΑΝΑΖΗΤΗΣΗ ════════════ */
function search(q){q=q.trim().toLowerCase();const r=$('#res');if(q.length<2){r.classList.remove('on');return}const out=[];
 CUST.forEach(c=>{if(c.n.toLowerCase().includes(q))out.push([`dCust('${c.id}')`,c.n,'Πελάτης'])});INST.forEach(x=>{if(x.n.toLowerCase().includes(q))out.push([`dInst('${x.id}')`,x.n,'Εγκατάσταση'])});
 UNITS.forEach(u=>{if(u.sn.toLowerCase().includes(q))out.push([`dUnit('${u.sn}')`,u.sn+' · '+prod(u.k).sku,'Μονάδα'])});PO.forEach(p=>{if(p.id.toLowerCase().includes(q))out.push([`dPO('${p.id}')`,p.id+' · '+supN(p.sup),'Παραγγελία'])});
 OFFERS.forEach((o,k)=>{if(o.id.toLowerCase().includes(q))out.push([`dOffer(${k})`,o.id+' · '+cust(o.c).n,'Προσφορά'])});SUP.forEach(s=>{if(s.n.toLowerCase().includes(q))out.push([`dSup('${s.id}')`,s.n,'Προμηθευτής'])});LEADS.forEach(l=>{if(l.n.toLowerCase().includes(q))out.push([`dLead('${l.id}')`,l.n,'Ευκαιρία'])});
 r.innerHTML=out.slice(0,12).map(([f,n,k])=>`<a onclick="${f};$('#res').classList.remove('on')">${n}<small>${k}</small></a>`).join('')||'<div class="empty">Κανένα αποτέλεσμα</div>';r.classList.add('on')}
/* ════════════ ΕΚΚΙΝΗΣΗ ════════════ */
seed();
$('#q').addEventListener('input',e=>search(e.target.value));document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#res').classList.remove('on')});
$('#dbg').onclick=closeD;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
$('#burger').onclick=()=>$('#side').classList.toggle('on');
$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark'};
go('dash');
</script>
</body>
</html>
