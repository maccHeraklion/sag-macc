 UNITS.forEach(u=>{if(u.sn.toLowerCase().includes(q))add(`dUnit('${u.sn}')`,u.sn+' · '+prod(u.k).n.split(' (')[0],'Μονάδα')});PO.forEach(p=>{if(p.id.toLowerCase().includes(q))add(`dPO('${p.id}')`,p.id+' · '+supN(p.sup),'Παραγγελία')});
 OFFERS.forEach((o,k)=>{if(o.id.toLowerCase().includes(q))add(`dOffer(${k})`,o.id+' · '+cust(o.c).n,'Προσφορά')});SUP.forEach(s=>{if(s.n.toLowerCase().includes(q))add(`dSup('${s.id}')`,s.n,'Προμηθευτής')});LEADS.forEach(l=>{if(l.n.toLowerCase().includes(q))add(`dLead('${l.id}')`,l.n,'Ευκαιρία')});

/* ══════════ ΖΩΝΤΑΝΑ ΜΕΣΑ ΣΤΟ TAGOIO (Φάση 1Α) ══════════
   Ο τιμοκατάλογος έρχεται από τα δεδομένα του widget (costing_list, ίδια μορφή v4 με το Δημιουργία Προσφοράς).
   Χωρίς TagoIO (π.χ. αρχείο στον υπολογιστή) το demo δουλεύει με τα πλασματικά δεδομένα. Οι συναλλαγές μένουν πλασματικές ως τη Φάση 2. */
async function inflateB64(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('deflate');return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text())}
function findCL(src){if(!src||typeof src!=='object')return null;if(Array.isArray(src)){for(const e of src){const r=findCL(e);if(r)return r}return null}if(src.variable==='costing_list'&&src.metadata&&src.metadata.cl)return src;for(const v of Object.values(src)){if(v&&typeof v==='object'){const r=findCL(v);if(r)return r}}return null}
async function liveCatalog(src){try{const pt=findCL(src);if(!pt)return;const c=await inflateB64(pt.metadata.cl);if(!c||!Array.isArray(c.i))return;
 const IT=c.i.map(x=>Array.isArray(x)?[x[0],c.ct[x[1]],c.in[x[2]],c.vn[x[3]],x[4],x[5]]:[x.sku,x.cat,x.ind,x.ven,x.pr,x.d]),by={};IT.forEach(x=>by[x[0]]=x);
 const CP=(c.pk||[]).map(k=>{const it=(k.it||[]).map(i=>({q:i.q,n:(by[i.sku]||[,,,,,i.sku])[5],p:(by[i.sku]||[])[4]||0}));return{n:k.n,it,sum:it.reduce((s,i)=>s+i.q*i.p,0)}});
 applyRealCatalog({IT,SUBSYS:[],CATPK:CP,u:c.u});LIVE={n:IT.length,u:c.u};banner();go(ST.page);toast('Φορτώθηκε ο τιμοκατάλογος: '+IT.length+' είδη')}catch(e){console.warn('liveCatalog',e)}}
/* ══════════ ΖΩΝΤΑΝΑ: ΠΕΛΑΤΕΣ & ΕΓΚΑΤΑΣΤΑΣΕΙΣ (Φάση 1Β) ══════════
   Από τη συσκευή «SAG Εποπτεία»: subs_chunk / subs_summary (analysis subscriptionManage, κάθε 30′) και fleet_field
   (πίνακας στόλου του πυρήνα). Μέσα στο TagoIO οι πλασματικές συναλλαγές σβήνουν· όσα δεν έχουν ακόμη πηγή μένουν κενά.
   Χρέωση σύνδεσης LoRaWAN ανά όργανο (Μιχάλης 8/11): σήματα = ό,τι μετρά το όργανο, ελάχιστο 3, κλίμακα 3 / 8 / 48. */
let LIVEF=null,LASTF=null;const FL={};
function findAll(src,name,out=[]){if(!src||typeof src!=='object')return out;if(Array.isArray(src)){for(const e of src)findAll(e,name,out);return out}if(src.variable===name&&src.metadata){out.push(src);return out}for(const v of Object.values(src))if(v&&typeof v==='object')findAll(v,name,out);return out}
const tierPrice=t=>{const x=SUBITEMS.find(z=>z.sku==='TAGO-Actility '+t);return x?x.price:null};
function sgCharge(sg){let sum=0,miss=0;for(const[t,n,sig,tier]of sg||[]){const pr=tier?tierPrice(tier):null;if(pr==null)miss+=n;else sum+=n*pr}return{sum,miss}}
const sgText=sg=>(sg||[]).map(([t,n,sig,tier])=>`${n}× ${esc(t)} · ${sig==null?'άγνωστα σήματα':sig+' σήματα → κλίμακα '+(tier||'πάνω από 48')}`).join('<br>')||'—';
const shText=sh=>(sh||[]).map(([t,o,x])=>`${esc(t)} → χρεώνεται στο «${esc(o)}»${x===1?' <span class="sub">(άλλος πελάτης · θέλει απόφαση)</span>':x===2?' <span class="sub">(άλλος πελάτης · αποφασισμένο)</span>':''}`).join('<br>');
function banner(){const d=$('.demo');if(!d)return;if(!LIVEF){if(LIVE)d.textContent='Ζωντανός τιμοκατάλογος ('+LIVE.n+' είδη) · πλασματικές συναλλαγές';return}
 d.textContent='Ζωντανά: '+LIVEF.c+' πελάτες · '+LIVEF.f+' εγκαταστάσεις'+(LIVEF.d?' ('+LIVEF.d+' με όλα τα όργανα και σε άλλη εγγραφή)':'')+(LIVEF.t?' · '+LIVEF.t+' δοκιμαστικές':'')+(LIVE?' · τιμοκατάλογος '+LIVE.n+' είδη':'')+' · συναλλαγές από τη Φάση 2'}
function readFleet(src){
 for(const r of findAll(src,'fleet_field')){let t={};try{t=JSON.parse(r.metadata.text||'{}')}catch(e){}if(!t.i)continue;const tm=String(r.time||'');if(!FL[t.i]||tm>=FL[t.i].tm)FL[t.i]={tm,sev:+r.metadata.severity||0}}
 const sums=findAll(src,'subs_summary');if(!sums.length)return;
 const sm=sums.sort((a,b)=>String(b.group||b.time||'').localeCompare(String(a.group||a.time||'')))[0],np=(sm.metadata||{}).parts||0;
 const parts=findAll(src,'subs_chunk').filter(r=>String(r.group)===String(sm.group)).sort((a,b)=>(a.metadata.part||0)-(b.metadata.part||0));
 if(!np||parts.length<np){console.warn('liveFleet: λείπουν κομμάτια',parts.length,'/',np);return}
 LASTF={items:[].concat(...parts.map(r=>r.metadata.items||[])),pricing:(sm.metadata||{}).pricing||null}}
function liveFleet(src){try{readFleet(src);if(!LASTF)return;
 const cs=LASTF.items.filter(x=>x.k==='c'),fs=LASTF.items.filter(x=>x.k==='f');
 CUST.length=0;for(const c of cs)CUST.push({id:c.i,n:c.n||'—',t:'Πελάτης',vat:'—',city:'—',st:'Ενεργός',since:'—',owner:'—',p:null,m:c.m||'',ph:c.p||''});
 if(fs.some(f=>!CUST.some(c=>c.id===f.c)))CUST.push({id:'_nc',n:'Χωρίς δηλωμένο πελάτη',t:'—',vat:'—',city:'—',st:'Έλεγχος',since:'—',owner:'—',p:null});
 for(let k=PROD.length-1;k>=0;k--)if(PROD[k].kind==='live')PROD.splice(k,1);
 for(const A of [OFFERS,INV,VISITS,LEADS,ACT,PO,BILLS,SPAY,PAYOUT,UNITS,MOVES,TICK])A.length=0;
 for(const k of Object.keys(CAT))PROD.push({k:'lvc_'+k,n:'Τρέχουσες συνδρομές · '+CAT[k].n,kind:'live',cats:[k],price:0});
 INST.length=0;const today=ISO(new Date());
 for(const f of fs){const id=f.i,c=CUST.some(x=>x.id===f.c)?f.c:'_nc',fv=FL[String(id).slice(-6)],h=fv?['ok','office','check','visit'][fv.sev]||'ok':'ok',ch=sgCharge(f.sg);
  PROD.push({k:'lv_'+id,n:'Τρέχουσα συνδρομή (TagoIO)',kind:'live',cats:[CAT[f.cat]?f.cat:'field'],price:ch.sum,renew:ch.sum});
  const note=f.tst?'Δοκιμαστική εγγραφή: δεν χρεώνεται':f.dup?'Όλα τα όργανα υπάρχουν και σε άλλη εγγραφή του ίδιου πελάτη: πιθανή διπλοεγγραφή, δεν χρεώνεται':f.s&&f.s!=='active'?'Συνδρομή σε '+(f.s==='paused'?'παύση':'διακοπή'):f.odd?'Η ημερομηνία λήξης δεν είναι σε καθαρή μορφή':f.nod?'Ο αγρός δεν έχει dashboard':'';
  INST.push({id,c,n:f.n||'—',cat:CAT[f.cat]?f.cat:'field',step:7,h,plan:'lv_'+id,sub:'lv_'+id,qty:1,start:'',end:f.e||'',need:[],units:[],sg:f.sg||[],sh:f.sh||[],dup:f.dup?1:0,tst:f.tst?1:0,miss:ch.miss,u:f.u||[],tcost:f.cost||'',tlist:f.list||'',note});
  if(h==='visit')TICK.push({id:'ΕΠ-'+String(id).slice(-4),i:id,k:'Βλάβη',src:'Εποπτεία',t:'Ο πίνακας στόλου ζητά επίσκεψη',st:'Ανοιχτό',who:'—',pr:'Υψηλή',d:today,sla:addD(2)});
  if((f.sh||[]).some(x=>x[2]===1))TICK.push({id:'ΚΟ-'+String(id).slice(-4),i:id,k:'Αίτημα',src:'Συνδρομές',t:'Κοινό όργανο με άλλον πελάτη: σε ποιον χρεώνεται;',st:'Ανοιχτό',who:'—',pr:'Μέση',d:today,sla:addD(7)})}
 for(const pr of LASTF.pricing||[])if(/subscriptionPricing/i.test(pr.n))for(const[k,v]of Object.entries(pr.p||{})){const x=SUBPK.find(q=>q.key===k);if(x){x.price=v;x.renew=v}}
 LIVEF={c:cs.length,f:fs.length,d:fs.filter(f=>f.dup).length,t:fs.filter(f=>f.tst).length};banner();go(ST.page)}catch(e){console.warn('liveFleet',e)}}
async function liveAll(src){await liveCatalog(src);liveFleet(src)}
if(window.TagoIO&&window.parent!==window){try{TagoIO.onStart(w=>liveAll(w));TagoIO.onRealtime(p=>liveAll(p));TagoIO.ready()}catch(e){console.warn(e)}}
go('dash');
</script>
</body>
</html>
